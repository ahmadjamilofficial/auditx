<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background - dark near-black for contrast -->
  <rect width="64" height="64" rx="14" fill="#0B0C0E"/>

  <!-- W monogram - geometric construction -->
  <g fill="#FFFFFF">
    <!-- Left vertical bar -->
    <rect x="12" y="14" width="8" height="36" rx="1"/>

    <!-- Middle inverted V -->
    <path d="M28 14 L36 50 L44 14 L40 14 L36 38 L32 14 Z"/>

    <!-- Right vertical bar -->
    <rect x="44" y="14" width="8" height="36" rx="1"/>
  </g>

  <!-- Subtle accent line at bottom -->
  <rect x="12" y="54" width="40" height="2" rx="1" fill="#3B82F6" opacity="0.8"/>
</svg>
